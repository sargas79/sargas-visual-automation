name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Stamp manifest
        run: node tools/release-manifest.mjs "${{ github.event.release.tag_name }}"

      - name: Package
        run: cd dist && zip -r ../module.zip .

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.zip dist/module.json --clobber
